name: .NET

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore WorkNest.slnx

      - name: Build
        run: dotnet build WorkNest.slnx --no-restore --configuration Release --verbosity minimal

      - name: Test
        run: dotnet test WorkNest.slnx --no-build --configuration Release --verbosity minimal
